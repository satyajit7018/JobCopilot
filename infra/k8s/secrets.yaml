apiVersion: v1
kind: Secret
metadata:
  name: jobcopilot-secrets
  namespace: production
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_BASE64_SECURE_JWT_SECRET_32B"
  JOBCOPILOT_MASTER_KEY: "base64:REPLACE_WITH_BASE64_ENVELOPE_ENCRYPTION_KEY_32B"
  DATABASE_URL: "postgresql://jobcopilot_admin:REPLACE_PASSWORD@rds-endpoint.amazonaws.com:5432/jobcopilot?sslmode=require"
  REDIS_URL: "rediss://:REPLACE_PASSWORD@redis-endpoint.amazonaws.com:6379/0"
  S3_BUCKET_NAME: "jobcopilot-docs-production-us-east-1"
  AWS_ACCESS_KEY_ID: "REPLACE_AWS_ACCESS_KEY_ID"
  AWS_SECRET_ACCESS_KEY: "REPLACE_AWS_SECRET_ACCESS_KEY"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jobcopilot-config
  namespace: production
data:
  ENV: "production"
  DEBUG: "false"
  DB_MODE: "postgres"
  STORAGE_BACKEND: "s3"
  USE_CELERY: "true"
  DEFAULT_LLM_PROVIDER: "local"
  LLM_CACHE_ENABLED: "true"
  CIRCUIT_BREAKER_ENABLED: "true"
  IDEMPOTENCY_TTL_SECONDS: "86400"
  MFA_ISSUER: "JobCopilot"
  SESSION_INACTIVITY_TIMEOUT_MINUTES: "120"
