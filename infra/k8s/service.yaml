apiVersion: v1
kind: Service
metadata:
  name: jobcopilot-api-service
  namespace: production
  labels:
    app: jobcopilot
    component: api
spec:
  type: ClusterIP
  selector:
    app: jobcopilot
    component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
