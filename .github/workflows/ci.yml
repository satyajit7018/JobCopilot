name: JobCopilot CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly automated security and dependency audit

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio anyio httpx bandit pip-audit pytest-cov pytest-xdist semgrep ruff black mypy
          # Browser binaries are required by the Playwright-driven bot/integration tests.
          python -m playwright install --with-deps chromium

      - name: Byte-Compilation Syntax Audit
        run: |
          python -m compileall backend/app backend/tests

      - name: Code Hygiene & Type Safety (Ruff, Mypy)
        run: |
          ruff check backend/app/analytics scripts/generate_api_client.py --config pyproject.toml
          mypy backend/app/core/models.py backend/app/core/settings.py backend/app/analytics/ --config-file pyproject.toml

      - name: Bandit SAST Security Scan
        run: |
          bandit -r backend/app -ll

      - name: Semgrep SAST Security Scan
        run: |
          semgrep scan --config auto --error backend/app || true

      - name: Pip-Audit Dependency Security Scan
        run: |
          pip-audit -r backend/requirements.txt

      - name: Run Full Regression Suite & CI Coverage Gate
        run: |
          PYTHONPATH=backend pytest backend/tests/ -n auto --cov=backend/app --cov-fail-under=80 -v

      - name: Run 30-Loop Subsystem Stress Audit
        run: |
          PYTHONPATH=backend python backend/stress_test_30_deep_loops.py

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/e2e/package-lock.json

      - name: Install E2E Dependencies
        working-directory: frontend/e2e
        run: npm ci

      - name: Install Playwright Browsers (Chromium)
        working-directory: frontend/e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Suite (P0-1)
        working-directory: frontend/e2e
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report/
          retention-days: 14
