name: JobCopilot CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio anyio httpx

      - name: Byte-Compilation Syntax Audit
        run: |
          python -m compileall backend/app backend/tests

      - name: Run Full 59-Test Suite
        run: |
          pytest backend/tests/ -v

      - name: Run 30-Loop Subsystem Stress Audit
        run: |
          python backend/stress_test_30_deep_loops.py
