# JobCopilot — production-like stack (Postgres, Redis, Celery, hardened defaults).
#
# Secrets are injected from the environment, never committed. Copy
# `.env.production.example` to `.env.production` and fill in real values, then:
#
#     docker compose --env-file .env.production -f docker-compose.production.yml up -d --build
#
# See docs/DEPLOY_RUNBOOK.md for the full build -> deploy -> smoke sequence.
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jobcopilot_postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-jobcopilot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-jobcopilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobcopilot} -d ${POSTGRES_DB:-jobcopilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jobcopilot_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobcopilot_api
    restart: always
    environment:
      - ENV=production
      - DEBUG=false
      - DB_MODE=postgres
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jobcopilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jobcopilot}
      - JOBCOPILOT_DATA_DIR=/data
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=local
      - USE_CELERY=true
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required (>=32 chars)}
      - JOBCOPILOT_MASTER_KEY=${JOBCOPILOT_MASTER_KEY:?JOBCOPILOT_MASTER_KEY is required}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:?GOOGLE_OAUTH_CLIENT_ID is required (only prod sign-in path)}
      - INBOUND_EMAIL_WEBHOOK_SECRET=${INBOUND_EMAIL_WEBHOOK_SECRET:?INBOUND_EMAIL_WEBHOOK_SECRET is required (inbound webhook is public)}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
    volumes:
      - jobcopilot_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobcopilot_worker
    restart: always
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "-Q", "priority.high,priority.normal,priority.low"]
    # The worker is not an HTTP server, so the image's curl-:8000 healthcheck
    # would always fail. Probe the Celery worker directly instead.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -t 8 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - ENV=production
      - DEBUG=false
      - DB_MODE=postgres
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jobcopilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jobcopilot}
      - JOBCOPILOT_DATA_DIR=/data
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=local
      - USE_CELERY=true
      - JWT_SECRET=${JWT_SECRET}
      - JOBCOPILOT_MASTER_KEY=${JOBCOPILOT_MASTER_KEY}
      # The worker loads the same Settings model, so it hits the same
      # production fail-closed guard and needs these too.
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - INBOUND_EMAIL_WEBHOOK_SECRET=${INBOUND_EMAIL_WEBHOOK_SECRET}
    volumes:
      - jobcopilot_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobcopilot_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  jobcopilot_data:
  postgres_data:
  redis_data:
