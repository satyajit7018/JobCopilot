<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#06080d" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#ringGrad)" stroke-width="4" />

  <!-- Outer Orbit Arc -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(99, 102, 241, 0.15)" stroke-width="2" stroke-dasharray="8 12" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(6, 182, 212, 0.12)" stroke-width="1.5" />

  <!-- Core Glow Backdrop -->
  <circle cx="256" cy="256" r="120" fill="rgba(99, 102, 241, 0.25)" filter="url(#glow)" />

  <!-- Lightning Stealth Bolt Emblem -->
  <path d="M280 64 L152 272 L248 272 L216 448 L360 224 L264 224 Z" 
        fill="url(#boltGrad)" 
        filter="url(#glow)" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Futuristic Target HUD Accents -->
  <path d="M120 180 L100 180 L100 200" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <path d="M392 180 L412 180 L412 200" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <path d="M120 332 L100 332 L100 312" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" />
  <path d="M392 332 L412 332 L412 312" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" />
</svg>
