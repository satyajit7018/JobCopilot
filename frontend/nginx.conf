events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Hashed build output never changes, so browsers can keep it for a year.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # Retires the legacy UI's service worker; must never be cached.
        location = /sw.js {
            add_header Cache-Control "no-cache";
            add_header Service-Worker-Allowed "/";
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # Client-side routes (/jobs, /settings, ...) all load the app shell, which is never cached.
        location / {
            add_header Cache-Control "no-cache";
            include /etc/nginx/security-headers.conf;
            try_files $uri $uri/ /index.html;
        }

        # API Reverse Proxy
        location /api/ {
            proxy_pass http://api:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket Reverse Proxy
        location /ws {
            proxy_pass http://api:8000/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
