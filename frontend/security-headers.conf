# Included in every location: nginx drops server-level add_header lines in any
# location that sets its own headers, so they live here instead.
# Mirrors the API's SecurityHeadersMiddleware. No inline scripts are allowed; inline
# styles are, because React sets style attributes (progress bars, logo tints).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self'; img-src 'self' data: https:; worker-src 'self'; frame-src https://accounts.google.com; connect-src 'self' https://accounts.google.com ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
